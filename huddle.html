<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning Huddle — Driven Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--dk:#050605;--s:#0C1010;--s2:#121818;--br:rgba(57,255,20,.28);--tx:#E8EDE8;--td:#8FA8A0;--g:#39FF14;--red:#FF6B6B;--hit:#143018;--miss:#3a1212}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--dk);color:var(--tx);font:15px/1.45 Barlow,sans-serif}
header{border-bottom:3px solid var(--g);padding:18px 24px 14px;background:linear-gradient(135deg,#040804,#0A140A)}
h1{margin:0;font-family:"Bebas Neue",sans-serif;font-size:2.6rem;letter-spacing:2px;color:var(--g);font-weight:400}
.sub{font-family:"Barlow Condensed",sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--g);font-size:12px}
a{color:var(--g)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.nav a,.nav button{font:13px/1 "Barlow Condensed",sans-serif;letter-spacing:.4px;color:var(--g);background:transparent;border:1px solid var(--g);border-radius:6px;padding:6px 12px;text-decoration:none;cursor:pointer}
.nav a:hover,.nav button:hover{background:rgba(57,255,20,.12)}
button.primary{font:inherit;background:var(--g);color:#041004;border:0;border-radius:6px;padding:8px 12px;font-weight:700;cursor:pointer}
button.ghost{font:inherit;color:var(--tx);background:transparent;border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:8px 12px;cursor:pointer}
main{padding:18px 24px 48px;max-width:1280px}
.agenda{border:1px solid var(--g);border-radius:12px;padding:14px 18px 12px;max-width:28rem;margin:0 0 22px}
.agenda h2{margin:0 0 8px;font-family:"Barlow Condensed",sans-serif;font-size:14px;letter-spacing:1.6px;text-transform:uppercase;color:var(--g);font-weight:700}
.agenda ol{margin:0;padding-left:1.2rem}
.agenda li{margin:3px 0}
.agenda ul{list-style:none;margin:3px 0 6px;padding-left:.2rem}
.agenda ul li{color:var(--td)}
.agenda ul li::before{content:"– "}
.lead{color:var(--td);max-width:42rem}
.scroll{overflow-x:auto;border:1px solid var(--br);border-radius:8px;background:#070b07}
table{border-collapse:collapse;width:100%;min-width:1080px}
.task-table{min-width:0;width:100%}
.tasks .scroll{max-height:420px}
.task-table thead th{position:sticky;top:0;background:#070b07;z-index:1}
.task-table th,.task-table td{text-align:left}
.task-table td:first-child{white-space:normal;min-width:14rem}
th,td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.06);text-align:right;white-space:nowrap}
th:first-child,td:first-child,tbody th{text-align:left}
thead th{color:var(--g);font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
thead th small{display:block;font-weight:600;letter-spacing:.3px}
tbody th{font-size:15px}
tr.team th,tr.team td{border-top:2px solid var(--g);font-weight:700}
tr.top td:first-child{box-shadow:inset 3px 0 0 var(--g)}
.pair b{font-variant-numeric:tabular-nums}
.pair span{font-size:12px;font-weight:600}
.pair.hit{background:#1b5c28;color:#d8ffc8}
.pair.miss{background:#7a2424;color:#ffd0d0}
.logbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}
.logbar button,.task-add button,#goalForm button{font:13px/1 Barlow,sans-serif;font-weight:700;color:var(--g);background:transparent;border:1px solid var(--g);border-radius:8px;padding:7px 12px;cursor:pointer}
.logbar button:hover,.task-add button:hover,#goalForm button:hover{background:rgba(57,255,20,.12)}
.logbar span{color:var(--td);font-size:13px}
.fine,.howto{color:var(--td);font-size:13px;max-width:62rem}
.howto{margin:4px 0 8px}
.howto b{color:var(--g);font-weight:700}
details{margin-top:12px}
#goalForm label{display:flex;justify-content:space-between;gap:12px;max-width:28rem;margin:6px 0}
#goalForm input,.task-add input{background:var(--s2);color:var(--tx);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:8px 10px}
#goalForm input{width:8rem}
#status{min-height:1.2em;margin-top:8px}
#status.bad{color:var(--red)}
.scoreboard{margin:0 0 8px}
.scoreboard h2,.tasks h2,.role-map h2{margin:0;font-family:"Bebas Neue",sans-serif;font-size:2.6rem;letter-spacing:2px;color:var(--g);font-weight:400}
.scoreboard h3{margin:18px 0 10px;font-family:"Barlow Condensed",sans-serif;font-size:15px;letter-spacing:1.6px;text-transform:uppercase;color:var(--g);font-weight:700}
.tasks{margin-top:26px}
.tasks h2{margin:8px 0 4px;font-size:2rem}
.frozen{margin:4px 0 8px;color:var(--g);font-family:"Barlow Condensed",sans-serif;letter-spacing:1.4px;text-transform:uppercase;font-size:13px}
.loads-hero{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;background:linear-gradient(160deg,#071207,#102410);border:2px solid var(--g);border-radius:12px;padding:14px 18px;box-shadow:0 0 28px rgba(57,255,20,.12)}
.kicker{margin:0;font-family:"Bebas Neue",sans-serif;font-size:1.7rem;letter-spacing:.6px;color:var(--g);font-weight:400;text-transform:uppercase}
.loads-hero .fine{margin:2px 0 0}
.loads-figs{display:flex;flex-wrap:wrap;gap:8px 36px}
.loads-figs b{display:block;font-family:"Bebas Neue",sans-serif;font-size:clamp(3.4rem,8vw,5.2rem);line-height:.82;color:var(--g);font-weight:400;font-variant-numeric:tabular-nums}
.loads-figs b.miss{color:var(--red);background:transparent}
.loads-figs span{display:block;margin-top:4px;font-family:"Barlow Condensed",sans-serif;letter-spacing:1px;text-transform:uppercase;font-size:13px;color:var(--td)}
.loads-figs small{display:block;color:var(--td);font-size:12px}
.load-people{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.load-people span{background:rgba(0,0,0,.28);border:1px solid var(--br);border-radius:8px;padding:8px 10px;min-width:8.5rem}
.load-people b{display:block;font-family:"Bebas Neue",sans-serif;font-size:1.6rem;line-height:1;color:var(--g);font-weight:400}
.load-people small{display:block;margin-top:2px;color:var(--td);font-size:11px;letter-spacing:.3px;text-transform:uppercase}
.task-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 0}
.task-add input[type="text"]{min-width:12rem;flex:1}
button.pill,span.pill{display:inline-block;font:11px/1.2 Barlow,sans-serif;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:transparent;border-radius:999px;padding:3px 10px;border:1px solid transparent}
button.pill{cursor:pointer}
button.pill.open,span.pill.open{border-color:#e07a3a;color:#e07a3a}
button.pill.overdue,span.pill.overdue{border-color:var(--red);color:var(--red)}
button.pill.done,span.pill.done{border-color:var(--g);color:var(--g)}
button.pill:hover{filter:brightness(1.15)}
.role-map{margin-top:28px}
.role-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
.role-map h2{margin:8px 0 4px;font-size:2rem}
.role-filters{display:flex;flex-wrap:wrap;gap:10px 12px;margin:12px 0}
.role-filters label{display:flex;flex-direction:column;gap:4px;color:var(--td);font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.role-filters select{background:var(--s2);color:var(--tx);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:8px 10px;font:15px/1.3 Barlow,sans-serif;text-transform:none;letter-spacing:0;font-weight:400;min-width:11rem;color-scheme:dark}
.role-filters select:focus{outline:none;border-color:var(--g)}
.week-strip{background:linear-gradient(160deg,#071207,#102410);border:2px solid var(--g);border-radius:12px;padding:12px 14px;margin:12px 0}
.week-strip h3,.role-person{margin:0 0 6px;font-family:"Bebas Neue",sans-serif;font-size:1.7rem;letter-spacing:1px;color:var(--g);font-weight:400}
.role-person{margin:18px 0 8px;font-family:"Barlow Condensed",sans-serif;font-size:16px;letter-spacing:1.2px;text-transform:uppercase}
.week-strip ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.week-strip li{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;background:rgba(0,0,0,.28);border:1px solid var(--br);border-radius:8px;padding:8px 10px}
.week-strip li.miss{background:var(--miss);border-color:rgba(255,107,107,.45);color:#ffd0d0}
.week-strip li span:nth-child(3){flex:1;min-width:12rem}
.overdue-count{margin-left:8px;color:var(--td);font:12px/1 Barlow,sans-serif;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.role-person .pill{margin-left:8px;vertical-align:middle}
.role-table{min-width:920px}
.role-table td{white-space:normal}
.role-table td:nth-child(n+5),.role-table th:nth-child(n+5){white-space:nowrap}
.role-table tr.miss{background:var(--miss);color:#ffd0d0}
.type-badge{display:inline-block;font:11px/1.2 Barlow,sans-serif;font-weight:700;letter-spacing:.3px;border-radius:999px;padding:3px 8px;border:1px solid transparent;white-space:nowrap}
.type-badge.relationship{color:#9fd0ff;background:rgba(74,158,255,.16);border-color:rgba(74,158,255,.55)}
.type-badge.operational{color:#c8f5a0;background:rgba(57,255,20,.12);border-color:rgba(57,255,20,.45)}
.type-badge.judgment{color:#1a1200;background:#FFB800;border-color:#FFB800}
button.pill:disabled{opacity:.55;cursor:wait}
#authGate{max-width:440px;margin:8px 0 24px}
.gate-card{background:var(--s);border:1px solid var(--br);border-radius:12px;padding:22px 20px}
.gate-card h2{margin:0 0 8px;font-size:1.4rem}
.gate-card p{color:var(--td);margin:0 0 14px}
.gate-card label{display:block;font-weight:600;margin:0 0 4px}
.gate-card input{width:100%;background:var(--s2);color:var(--tx);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:10px 12px;margin-bottom:12px}
.gate-card .primary,.gate-card .ghost{width:100%;margin-bottom:8px}
.gate-card .linkbtn{display:block;width:100%;background:none;border:0;color:var(--g);text-align:center;margin:2px 0 8px;cursor:pointer}
.gate-msg{min-height:1.3em;margin:8px 0 0}
.gate-msg.bad{color:var(--red)}
@media (max-width:800px){
  header,main{padding-left:14px;padding-right:14px}
  .loads-hero{align-items:flex-start}
  .task-table{min-width:0}
  .task-table thead{display:none}
  .task-table,.task-table tbody,.task-table tr,.task-table td{display:block;width:100%;white-space:normal}
  .task-table tr{padding:8px 0}
  .task-table td{border-bottom:0;padding:2px 10px 2px 12px}
  .task-table td::before{content:attr(data-label);display:block;color:var(--g);font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
  .task-table td:first-child{min-width:0;font-weight:700}
  .task-add input[type="text"],.task-add input[type="date"],.task-add button{width:100%}
  .role-table{min-width:0}
  .role-table tr{border-bottom:1px solid rgba(255,255,255,.1);padding:10px 0 12px}
  .role-filters,.role-filters label,.role-filters select{width:100%}
  .week-strip li{align-items:flex-start}
  .role-person .pill,.overdue-count{display:inline-block;margin:6px 0 0}
}
</style>
</head>
<body>
<header>
  <div class="sub">Driven Solutions · Sales</div>
  <h1>Morning Huddle</h1>
  <div class="sub">Weekdays 10:00 AM CT · 10 minutes</div>
  <div class="nav">
    <a href="index.html">L10 hub</a>
    <a href="crm.html">CRM</a>
    <button type="button" id="reload">Refresh</button>
    <button type="button" id="signOut" hidden>Sign out</button>
  </div>
</header>
<main>
  <nav class="agenda" aria-label="Agenda">
    <h2>Agenda</h2>
    <ol>
      <li>One win</li>
      <li>Scoreboard
        <ul>
          <li>Logistics</li>
          <li>Sales Rep</li>
        </ul>
      </li>
      <li>Top 3 Tasks</li>
      <li>Close meeting</li>
    </ol>
  </nav>
  <div id="authGate">
    <form class="gate-card" id="gateForm">
      <h2>Sign in</h2>
      <p id="gateLead">Sign in with your work email and password. Day-to-day sign-in does not send email.</p>
      <label for="gateEmail">Email</label>
      <input id="gateEmail" name="email" type="email" autocomplete="username" required placeholder="you@drivensol.com">
      <label for="gatePassword" id="gatePasswordLabel">Password</label>
      <input id="gatePassword" name="password" type="password" autocomplete="current-password" required>
      <div id="gatePassword2Wrap" hidden>
        <label for="gatePassword2">Password again</label>
        <input id="gatePassword2" name="password2" type="password" autocomplete="new-password">
      </div>
      <button class="primary" type="submit" id="gateSubmit">Sign in</button>
      <button class="ghost" type="button" id="gateGoogle">Sign in with Google</button>
      <button class="ghost" type="button" id="gateMode">First time? Create your password</button>
      <button class="linkbtn" type="button" id="gateForgot">Forgot password</button>
      <p id="gateMsg" class="gate-msg" role="status"></p>
    </form>
  </div>
  <div id="shell" hidden>
    <div id="board"></div>
    <p id="status" role="status"></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/crm-db.js"></script>
<script src="js/crm-auth.js"></script>
<script src="js/huddle-score.js"></script>
<script src="js/huddle-scorecard.js"></script>
<script src="js/huddle-tasks.js"></script>
<script src="js/huddle-role-map.js"></script>
<script src="js/huddle.js"></script>
</body>
</html>
