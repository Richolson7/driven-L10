<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Driven CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F1EF;--panel:#FFFFFF;--raise:#E8E8E5;--line:#D5D5D1;--text:#29292B;--muted:#67676B;
  --accent:#2F8A12;--fill:#87FC60;--fill-ink:#16210F;--warn:#B86E00;--bad:#C93A2C;
  --sales:#2F8A12;--ops:#1F77B4;--acct:#7A4FC4;--shadow:0 12px 40px rgba(20,20,22,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#232325;--panel:#2C2C2E;--raise:#3A3A3C;--line:#49494C;--text:#EDEDEA;--muted:#A9A9AC;
  --accent:#87FC60;--fill:#87FC60;--fill-ink:#16210F;--warn:#FFB547;--bad:#FF7466;
  --sales:#87FC60;--ops:#6CC4FF;--acct:#C9A6FF;--shadow:0 16px 48px rgba(0,0,0,.5);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#232325;--panel:#2C2C2E;--raise:#3A3A3C;--line:#49494C;--text:#EDEDEA;--muted:#A9A9AC;
  --accent:#87FC60;--fill:#87FC60;--fill-ink:#16210F;--warn:#FFB547;--bad:#FF7466;
  --sales:#87FC60;--ops:#6CC4FF;--acct:#C9A6FF;--shadow:0 16px 48px rgba(0,0,0,.5);color-scheme:dark;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.45 Barlow,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif;font-weight:600;letter-spacing:.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:6px;background:var(--raise);display:grid;place-items:center}
.mark svg{width:18px;height:18px}
.brand h1{font-size:22px}
.testflag{font-size:13px;color:var(--warn);border:1px solid var(--warn);border-radius:20px;padding:1px 10px}
.tabs{display:flex;gap:2px;margin-left:8px;overflow-x:auto}
.tab{background:none;border:0;padding:8px 12px;border-radius:6px;color:var(--muted);font-weight:600;white-space:nowrap}
.tab[aria-current="page"]{color:var(--text);background:var(--raise)}
.tab .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;text-align:center}
.spacer{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px}
.ghost:hover{border-color:var(--muted)}
.primary{background:var(--fill);color:var(--fill-ink);border:0;border-radius:6px;padding:7px 14px;font-weight:700}
.danger{background:none;border:1px solid var(--bad);color:var(--bad);border-radius:6px;padding:6px 12px}

main{padding:18px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar input[type=search],.bar select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.bar input[type=search]{min-width:220px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.stat{background:var(--panel);padding:12px 16px}
.stat b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:600;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.stat.won b{color:var(--accent)}

/* board */
.boardwrap{overflow-x:auto;padding-bottom:10px}
.zones{display:grid;grid-template-columns:repeat(8,minmax(230px,1fr));gap:10px;min-width:0}
.zone{grid-row:1;font-family:"Barlow Condensed",sans-serif;font-size:15px;font-weight:600;padding:4px 2px 6px;border-bottom:3px solid;display:flex;justify-content:space-between;align-items:end}
.zone small{font-family:Barlow,sans-serif;font-weight:500;color:var(--muted);font-size:12px}
.zone.sales{grid-column:1/4;border-color:var(--sales)}
.zone.operations{grid-column:4/7;border-color:var(--ops)}
.zone.accounting{grid-column:7/9;border-color:var(--acct)}
.col{grid-row:2;background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:420px}
.col.over{border-color:var(--accent);background:color-mix(in srgb,var(--panel) 85%,var(--accent))}
.colhead{padding:10px 12px;border-bottom:1px solid var(--line)}
.colhead h3{font-size:18px;display:flex;justify-content:space-between;align-items:baseline}
.colhead h3 .ct{font-family:Barlow,sans-serif;font-size:13px;color:var(--muted);font-weight:500}
.colhead .tot{font-size:13px;color:var(--muted)}
.wonmark{font-size:12px;color:var(--accent);font-weight:600}
.cards{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.card{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:6px;padding:9px 10px;cursor:grab;text-align:left;width:100%}
.card:hover{border-color:var(--muted)}
.card.won{border-left-color:var(--accent)}
.card.dragging{opacity:.4}
.card .co{font-weight:700;font-size:14px}
.card .desc{font-size:14px;color:var(--muted);margin:2px 0 6px}
.card .row{display:flex;justify-content:space-between;font-size:13px}
.card .money{font-weight:600}
.mg-good{color:var(--accent)}.mg-mid{color:var(--warn)}.mg-bad{color:var(--bad)}
.card .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.card .due{color:var(--warn);font-weight:600}
.empty{color:var(--muted);font-size:13px;padding:10px 4px;text-align:center}

/* tables / lists */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--raise)}
.tablewrap{overflow-x:auto}
.chip{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:20px;padding:1px 9px;color:var(--muted);white-space:nowrap}
.chip.active{border-color:var(--accent);color:var(--accent)}
.chip.vendor{border-color:var(--ops);color:var(--ops)}
.chip.lost{border-color:var(--bad);color:var(--bad)}
.filters{display:flex;gap:6px}
.filters button{background:none;border:1px solid var(--line);border-radius:20px;padding:4px 12px;color:var(--muted)}
.filters button[aria-pressed="true"]{border-color:var(--text);color:var(--text)}
.late{color:var(--bad);font-weight:600}

/* tasks */
.tgroup{margin-bottom:18px}
.tgroup h2{font-size:20px;margin-bottom:6px}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.task .tt{flex:1}
.task .tm{font-size:13px;color:var(--muted)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.auto{font-size:11px;border:1px solid var(--ops);color:var(--ops);border-radius:4px;padding:0 5px;margin-left:6px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:13px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:780px}
.cal .dow{background:var(--panel);padding:6px 8px;font-size:13px;color:var(--muted);font-weight:600}
.cal .day{background:var(--panel);min-height:104px;padding:6px}
.cal .day.out{background:var(--bg);color:var(--muted)}
.cal .day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .num{font-size:13px;font-weight:600;margin-bottom:4px}
.ev{display:block;width:100%;text-align:left;font-size:12px;border:0;border-radius:4px;padding:2px 6px;margin-bottom:3px;background:var(--raise);border-left:3px solid var(--ops);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.del{border-left-color:var(--accent)}

/* automations */
.rule{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px 16px}
.rule:last-child{border-bottom:0}
.rule h3{font-size:18px}
.rule .when{font-size:14px;color:var(--muted)}
.rule input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
.rule .days{width:160px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.rule .full{grid-column:1/-1}
.switch{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.sect h2{font-size:22px;margin:0 0 8px}
.sect p.lead{color:var(--muted);margin:0 0 10px;max-width:70ch}
.outbox li{padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px;list-style:none}
.outbox{margin:0;padding:0;max-height:440px;overflow:auto}
.outbox .tm{color:var(--muted);font-size:12px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.45);z-index:40;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:41;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.dhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dhead h2{font-size:24px;line-height:1.1}
.dhead .sub{color:var(--muted);font-size:14px}
.dbody{overflow-y:auto;padding:16px 18px;flex:1}
.path{display:flex;gap:3px;margin-bottom:14px;flex-wrap:wrap}
.path button{flex:1 1 auto;background:var(--raise);border:0;padding:6px 8px;font-size:12px;font-weight:600;color:var(--muted);border-radius:4px}
.path button.done{background:color-mix(in srgb,var(--accent) 22%,var(--raise));color:var(--text)}
.path button.cur{background:var(--fill);color:var(--fill-ink)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.kv div{background:var(--panel);padding:8px 12px}.kv b{display:block;font-size:20px;font-family:"Barlow Condensed",sans-serif}.kv span{font-size:12px;color:var(--muted)}
fieldset{border:0;padding:0;margin:0 0 16px}
legend{font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:600;margin-bottom:8px;padding:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.f{display:flex;flex-direction:column;gap:3px}
.f.wide{grid-column:1/-1}
.f label{font-size:13px;color:var(--muted)}
.f label .req{color:var(--warn)}
.f input,.f select,.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
.f.missing input,.f.missing select{border-color:var(--warn)}
.f textarea{min-height:70px;resize:vertical}
.mini{font-size:14px}
.mini li{list-style:none;padding:8px 0;border-bottom:1px solid var(--line)}
.mini{margin:0 0 10px;padding:0}
.addrow{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:6px;margin-top:6px}
.addrow input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.log{font-size:13px;color:var(--muted)}
.log li{list-style:none;padding:4px 0}
.log{padding:0;margin:0}
.dfoot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}

/* modal */
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:50;padding:16px}
.modal.open{display:grid}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);width:min(520px,100%);max-height:90vh;overflow:auto;padding:18px}
.mbox h2{font-size:22px;margin-bottom:4px}
.mbox p{color:var(--muted);margin:0 0 14px}
.mactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

.toasts{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;width:min(560px,92vw)}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;box-shadow:var(--shadow);width:100%}
.toast.won{background:var(--fill);color:var(--fill-ink);font-weight:600}
.toast.bad{background:var(--bad);color:#fff;font-weight:600}
.save-state{font-size:13px;color:var(--muted);max-width:340px}
.save-state.bad{color:var(--bad);font-weight:700}
.save-state.ok{color:var(--accent)}
.banner{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0 0 12px;color:var(--muted);font-size:13px}
button.zone{background:none;color:inherit;text-align:left;cursor:pointer;border-left:0;border-right:0;border-top:0;font:inherit;width:100%}
.zone.collapsed{opacity:.8}
.colhead{cursor:pointer}
.col.collapsed{min-height:160px}
.col.collapsed .cards,.col.collapsed .tot{display:none}
.col.collapsed .colhead h3{writing-mode:vertical-rl;transform:rotate(180deg);height:120px;font-size:15px;justify-content:flex-start;gap:8px}
.who{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.bar label.date{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px}
.bar label.date input{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}

.setup-stage{display:grid;grid-template-columns:28px 1fr 130px;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.setup-stage input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.cf{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);gap:8px}
.cfadd{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:6px;padding:10px 12px}
.cfadd input,.cfadd select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}

.prog{height:6px;background:var(--raise);border-radius:3px;margin:2px 0 6px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent)}
.si{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:space-between}
.si .docs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.upl{cursor:pointer}
.mention{color:var(--accent)}
li.agentnote{border-left:3px solid var(--fill);padding-left:10px}
.mchip{cursor:pointer;background:none}
#tour{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;width:min(370px,calc(100vw - 32px));background:var(--panel);border:2px solid var(--fill);border-radius:10px;box-shadow:var(--shadow);padding:14px 16px}
#tour h3{font-size:21px;margin:2px 0 4px}
#tour p{margin:0 0 12px;font-size:14px}
.tour-hl{outline:3px solid var(--fill)!important;outline-offset:3px;border-radius:6px}
.vr{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.vr input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.vbox{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.micon{background:var(--bad)!important;color:#fff!important}
.drawer.wide{width:min(940px,100%)}
.mbox.wide{width:min(860px,100%);padding:0;background:#fff}
.qd-actions{background:var(--panel);margin:0;padding:12px 16px;border-top:1px solid var(--line)}
.qlines{width:100%;border-collapse:collapse;margin-bottom:8px}
.qlines th{font-size:12px;padding:6px 4px}
.qlines td{padding:4px;border-bottom:1px solid var(--line)}
.qlines input,.qlines select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px;min-width:0}
.qlines .n{width:96px}.qlines .s{width:84px}
.qbox{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--raise);border-radius:8px;padding:10px 12px;margin-bottom:16px;font-size:14px}
.qhist{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.qhist .ql{font-size:13px;color:var(--muted)}
.emailcard{padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px}
.emailcard:last-child{border-bottom:0}
.emailcard pre{white-space:pre-wrap;font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;margin:8px 0;max-height:240px;overflow:auto}
details.seq{border-bottom:1px solid var(--line)}
details.seq:last-child{border-bottom:0}
details.seq summary{padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;list-style:none}
details.seq summary::-webkit-details-marker{display:none}
details.seq[open] summary{background:var(--raise)}
.seqhead{padding:10px 16px}
.step{padding:10px 16px;border-top:1px dashed var(--line);display:grid;gap:6px}
.step input,.step textarea,.seqhead select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
.step textarea{min-height:150px;resize:vertical}
.qdoc{background:#fff;color:#2b2b2d;font:14px/1.45 Barlow,Arial,sans-serif;max-width:820px;margin:0 auto}
.qd-head{background:#3A3A3C;color:#fff;display:flex;justify-content:space-between;align-items:flex-start;padding:26px 30px;border-bottom:5px solid #87FC60;gap:20px;flex-wrap:wrap}
.qd-brand{display:flex;gap:12px;align-items:center}
.qd-name{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:30px;font-weight:700;line-height:1}
.qd-web{color:#C3C3C3;font-size:13px}
.qd-title{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:34px;font-weight:700;color:#87FC60;text-align:right;line-height:1;margin-bottom:6px}
.qd-meta td{padding:1px 0 1px 14px;color:#fff;font-size:13px;border:0}
.qd-meta td:first-child{color:#C3C3C3}
.qd-body{padding:24px 30px 30px}
.qd-parties{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:22px;color:#2b2b2d}
.qd-parties h4{margin:0 0 4px;font-size:12px;color:#6b6b70;font-weight:600}
.qd-items{width:100%;border-collapse:collapse}
.qd-items th{background:#3A3A3C;color:#fff;font-size:12px;font-weight:600;padding:8px 10px}
.qd-items td{padding:9px 10px;border-bottom:1px solid #e3e3e0;font-size:14px;color:#2b2b2d}
.qd-items .r{text-align:right}
.qd-total td{border-bottom:0;font-weight:700;font-size:16px}
.qd-total td.r{border-top:2px solid #3A3A3C}
.qd-terms{margin-top:18px;font-size:13px;color:#4a4a4e}
.qd-accept{margin-top:30px;display:grid;grid-template-columns:2fr 1fr 1fr;gap:20px;font-size:12px;color:#6b6b70}
.qd-accept div{border-top:1px solid #9a9a9e;padding-top:4px}
.olog{font-size:12.5px}
.olog th{white-space:nowrap;cursor:pointer}
.olog input,.olog select{width:100%;min-width:72px;font:inherit;padding:4px 6px}
.olog td{vertical-align:top}
.olog .calc{background:color-mix(in srgb, var(--accent) 12%, transparent);white-space:nowrap;text-align:right}
.olog tfoot td{font-weight:700;border-top:2px solid var(--line)}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}body::before{display:none}#printArea{display:block}body,html{background:#fff}:root{padding:0}@page{margin:10mm}.qd-head,.qd-items th{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media (max-width:820px){.qd-parties{grid-template-columns:1fr}}
@media (max-width:820px){
  .grid2{grid-template-columns:1fr}
  .top{padding:8px 12px}
  .tabs{order:3;width:100%;margin-left:0}
  main{padding:12px}
  .fields{grid-template-columns:1fr}
  .addrow,.cfadd{grid-template-columns:1fr 1fr}
  .bar input[type=search]{min-width:0;flex:1}
}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
#authGate{min-height:100vh;display:grid;place-items:center;padding:24px}
#authGate[hidden],#shell[hidden]{display:none}
.gate-card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 24px;box-shadow:var(--shadow)}
.gate-card h1{font-size:34px;margin-bottom:8px}
.gate-card p{color:var(--muted);margin:0 0 16px}
.gate-card label{display:block;font-size:13px;font-weight:600;margin:0 0 4px}
.gate-card input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:12px}
.gate-card .primary,.gate-card .ghost{width:100%;margin-bottom:8px}
.gate-msg{min-height:1.3em;margin:8px 0 0;color:var(--text)}
.gate-msg.bad{color:var(--bad)}
</style>
</head>
<body>
<div id="authGate">
  <form class="gate-card" id="gateEmailForm">
    <h1>Driven CRM</h1>
    <p>Sign in with the Driven email on your team row. We email you a link or a one-time code. There is no password, and customers are not emailed.</p>
    <label for="gateEmail">Email</label>
    <input id="gateEmail" name="email" type="email" autocomplete="username" required placeholder="you@drivensol.com">
    <button class="primary" type="submit" id="gateSend">Email me a link</button>
    <label for="gateCode">One-time code</label>
    <input id="gateCode" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="Code from the email">
    <button class="ghost" type="button" id="gateVerify">Sign in with code</button>
    <p id="gateMsg" class="gate-msg" role="status"></p>
    <a href="index.html">L10 hub</a>
  </form>
</div>
<div id="shell" hidden>
<header class="top">
  <div class="brand">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><path d="M3 7l9 4 9-4M12 11v10" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/></svg></div>
    <h1>Driven CRM</h1>
    <a class="ghost" href="index.html" style="text-decoration:none">L10 hub</a>
    <a class="ghost" href="huddle.html" style="text-decoration:none">Morning huddle</a>
  </div>
  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-view="pipeline">Pipeline</button>
    <button class="tab" data-view="companies">Companies</button>
    <button class="tab" data-view="docs">Setup and forms</button>
    <button class="tab" data-view="tasks">Follow-ups<span class="n" id="taskCount" hidden></span></button>
    <button class="tab" data-view="calendar">Order calendar</button>
    <button class="tab" data-view="orders">Open orders</button>
    <button class="tab" data-view="automations">Automations</button>
    <button class="tab" data-view="sequences">Sequences<span class="n" id="seqCount" hidden></span></button>
    <button class="tab" data-view="setup">Setup</button>
  </nav>
  <div class="spacer"></div>
  <button class="ghost" data-act="quick-log" data-kind="call">Log call</button>
  <button class="ghost" data-act="quick-log" data-kind="email">Log email</button>
  <button class="ghost" data-act="quick-log" data-kind="touch">Log touch</button>
  <label class="log" id="whoLabel" for="who">Signed in as</label>
  <select id="who" class="who" aria-label="Signed-in teammate" disabled></select>
  <button class="ghost" id="authBtn" data-act="signout">Sign out</button>
  <span id="saveState" class="save-state" role="status">Loading…</span>
  <a class="ghost" href="https://claude.ai/artifact/5bWT2aSPJt5P2oMy1WJZZG" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Route planner</a>
  <button class="ghost" data-act="tour">Take the tour</button>
  <button class="ghost" data-act="voice">Talk it in</button>
  <button class="ghost" data-act="theme" id="themeBtn">Light mode</button>
  <button class="primary" data-act="feedback">Send feedback</button>
</header>

<main id="view"></main>

<div class="scrim" id="scrim" data-act="close"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="mbox" id="mbox"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="tour" hidden role="dialog" aria-label="Training tour"></div>
</div>
<div id="printArea"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="js/crm-db.js"></script>
<script src="js/crm-quote.js"></script>
<script src="js/crm-orders.js"></script>
<script src="js/crm-app.js"></script>
</body>
</html>
