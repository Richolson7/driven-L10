<!DOCTYPE html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driven Solutions calculator</title>
<style>
#driven-calculator, #driven-calculator * { box-sizing: border-box; }
#driven-calculator {
  font-family: "Segoe UI", Helvetica, Arial, sans-serif;
  color: #1b1d1b;
  background: #f6f5f1;
  padding: 16px;
  line-height: 1.4;
}
#driven-calculator h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.03em; }
#driven-calculator h2 { font-size: 1.1rem; margin: 0 0 8px; }
#driven-calculator p { margin: 0 0 10px; color: #5e655f; }
#driven-calculator .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 10px; }
#driven-calculator button, #driven-calculator input, #driven-calculator select {
  font: inherit; color: inherit; min-height: 42px; border-radius: 8px;
}
#driven-calculator button { border: 1px solid #e4e2db; background: white; padding: 0 12px; font-weight: 700; cursor: pointer; }
#driven-calculator button.on { background: #17884a; color: white; border-color: #17884a; }
#driven-calculator label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #5e655f; min-width: 120px; flex: 1; }
#driven-calculator input, #driven-calculator select { border: 1px solid #cfcbc2; padding: 8px 10px; background: white; width: 100%; }
#driven-calculator .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
#driven-calculator .card { background: white; border: 1px solid #e4e2db; border-radius: 12px; padding: 14px; }
#driven-calculator .diagram { width: 100%; background: #f6f5f1; border-radius: 8px; margin-top: 8px; }
#driven-calculator ul { margin: 8px 0 0; padding-left: 18px; color: #5e655f; font-size: 14px; }
#driven-calculator .check { flex-direction: row; align-items: center; font-size: 14px; color: #1b1d1b; min-height: 42px; }
@media (max-width: 800px) {
  #driven-calculator .grid { grid-template-columns: 1fr; }
}
@media print {
  #driven-calculator .noprint { display: none !important; }
}

</style>
</head>
