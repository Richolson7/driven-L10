<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driven Solutions calculator</title>
<style>
#driven-calculator, #driven-calculator * { box-sizing: border-box; }
#driven-calculator {
  --calc-bg: #f6f5f1;
  --calc-ink: #1b1d1b;
  --calc-muted: #5e655f;
  --calc-card: #fff;
  --calc-line: #e4e2db;
  --calc-input: #fff;
  --calc-diagram: #f6f5f1;
  --calc-case: #d9efe3;
  --calc-case-2: #c5e4d4;
  --calc-pine: #17884a;
  --calc-iso-top: #e7f6ee;
  --calc-iso-left: #b7dec8;
  --calc-iso-right: #8fcfab;
  font-family: "Segoe UI", Helvetica, Arial, sans-serif;
  color: var(--calc-ink);
  background: var(--calc-bg);
  padding: 16px;
  line-height: 1.4;
  border-radius: 16px;
}
#driven-calculator[data-theme="dark"] {
  --calc-bg: #141816;
  --calc-ink: #e7eee9;
  --calc-muted: #b7c4bb;
  --calc-card: #1e2622;
  --calc-line: #33403a;
  --calc-input: #121816;
  --calc-diagram: #101412;
  --calc-case: #1c4d36;
  --calc-case-2: #246348;
  --calc-pine: #8ddec0;
  --calc-iso-top: #2f7a56;
  --calc-iso-left: #1d5438;
  --calc-iso-right: #143c28;
  color-scheme: dark;
}
#driven-calculator h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.03em; color: var(--calc-ink); }
#driven-calculator h2 { font-size: 1.1rem; margin: 0 0 8px; color: var(--calc-ink); }
#driven-calculator p, #driven-calculator .label { margin: 0 0 10px; color: var(--calc-muted); }
#driven-calculator .head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
#driven-calculator .theme { flex: none; border-radius: 999px; min-height: 44px; }
#driven-calculator .groups { display: grid; gap: 10px; margin-bottom: 12px; }
#driven-calculator .group { border: 1px solid var(--calc-line); border-radius: 12px; padding: 10px; background: var(--calc-card); }
#driven-calculator .label { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
#driven-calculator .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 10px; }
#driven-calculator button, #driven-calculator input, #driven-calculator select {
  font: inherit; color: inherit; min-height: 42px; border-radius: 8px;
}
#driven-calculator button { border: 1px solid var(--calc-line); background: var(--calc-card); color: var(--calc-ink); padding: 0 12px; font-weight: 700; cursor: pointer; }
#driven-calculator button.on { background: #17884a; color: white; border-color: #17884a; }
#driven-calculator label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--calc-muted); min-width: 0; flex: 1 1 140px; }
#driven-calculator input, #driven-calculator select { border: 1px solid var(--calc-line); padding: 8px 10px; background: var(--calc-input); color: var(--calc-ink); width: 100%; }
#driven-calculator .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
#driven-calculator .card { background: var(--calc-card); border: 1px solid var(--calc-line); border-radius: 12px; padding: 14px; color: var(--calc-ink); }
#driven-calculator .diagram { width: 100%; background: var(--calc-diagram); border-radius: 8px; margin-top: 8px; }
#driven-calculator ul { margin: 8px 0 0; padding-left: 18px; color: var(--calc-muted); font-size: 14px; }
#driven-calculator .check { flex-direction: row; align-items: center; font-size: 14px; color: var(--calc-ink); min-height: 42px; }
#driven-calculator .warn { color: #c5362b; font-weight: 700; }
@media (max-width: 800px) {
  #driven-calculator .grid, #driven-calculator .head { grid-template-columns: 1fr; display: grid; }
  #driven-calculator .groups .row { display: grid; grid-template-columns: 1fr 1fr; }
  #driven-calculator .groups .row button { width: 100%; }
}
@media print {
  #driven-calculator .noprint { display: none !important; }
  #driven-calculator, #driven-calculator[data-theme="dark"] {
    --calc-bg: #fff;
    --calc-ink: #1b1d1b;
    --calc-muted: #5e655f;
    --calc-card: #fff;
    --calc-line: #e4e2db;
    --calc-input: #fff;
    --calc-diagram: #f6f5f1;
    --calc-case: #d9efe3;
    --calc-case-2: #c5e4d4;
    --calc-pine: #17884a;
    --calc-iso-top: #e7f6ee;
    --calc-iso-left: #b7dec8;
    --calc-iso-right: #8fcfab;
    color-scheme: light;
  }
}

.pd { display: grid; gap: 12px; }
.pd-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.pd-bar label, .pd label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--calc-muted); min-width: 0; flex: 1 1 120px; }
.pd input, .pd select, .pd textarea {
  font: inherit; color: var(--calc-ink); background: var(--calc-input); border: 1px solid var(--calc-line);
  border-radius: 8px; min-height: 42px; padding: 8px 10px; width: 100%;
}
.pd textarea { min-height: 88px; }
.pd button {
  font: inherit; font-weight: 700; min-height: 42px; border-radius: 8px; border: 1px solid var(--calc-line);
  background: var(--calc-card); color: var(--calc-ink); padding: 0 12px; cursor: pointer;
}
.pd button.on { background: #17884a; color: white; border-color: #17884a; }
.pd-views { display: flex; flex-wrap: wrap; gap: 6px; }
.pd-split { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(240px, 0.8fr); gap: 12px; }
.pd-frame {
  overflow: auto; max-height: 72vh; min-height: 240px; touch-action: none;
  border: 1px solid var(--calc-line); border-radius: 12px; background: var(--calc-diagram);
}
.pd-frame svg { display: block; width: calc(100% * var(--pd-zoom, 1)); height: auto; max-width: none; }
.pd-drawing-print { display: none; }
.pd-list { display: grid; gap: 4px; max-height: 220px; overflow: auto; margin-bottom: 8px; }
.pd-check { flex-direction: row !important; align-items: center; gap: 8px; font-size: 14px; color: var(--calc-ink); min-height: 36px; }
.pd-check input { width: auto; min-height: 0; }
.pd-card { background: var(--calc-card); border: 1px solid var(--calc-line); border-radius: 12px; padding: 12px; }
.pd-card h3 { margin: 0 0 8px; }
.pd-note { color: var(--calc-muted); font-size: 13px; margin: 8px 0; }
.pd-warn { color: #c5362b; font-weight: 700; }
.pd-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.pd-table th, .pd-table td { border-bottom: 1px solid var(--calc-line); text-align: left; padding: 4px 6px; }
.pd-file input { display: none; }
.pd-file { justify-content: center; border: 1px solid var(--calc-line); border-radius: 8px; min-height: 42px; padding: 0 12px; cursor: pointer; flex: 0 0 auto; }
@media (max-width: 800px) {
  .pd-split { grid-template-columns: 1fr; }
  .pd-views button { flex: 1 1 30%; }
}
@media print {
  .pd-cost, .pd-noprint, .pd-frame { display: none !important; }
  .pd-drawing-print { display: block; }
  .pd-drawing-print svg { width: 100%; height: auto; }
}

</style>
</head>
<body>
